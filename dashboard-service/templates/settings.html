<!DOCTYPE html>
<html>

<head>

    <title>

        Settings

    </title>

</head>

<body>

<h1>

Server Settings

</h1>

<a href="/guild/{{ guild_id }}">

Back

</a>

<hr>

<form method="POST">

<h3>

Log Channel

</h3>

<input
type="text"
name="log_channel"
value="{{ settings.log_channel if settings else '' }}"
>

<br><br>

<h3>

Moderator Role ID

</h3>

<input
type="text"
name="mod_role"
value="{{ settings.mod_role if settings else '' }}"
>

<br><br>

<h3>

Announcement Channel

</h3>

<input
type="text"
name="announcement_channel"
value="{{ settings.announcement_channel if settings else '' }}"
>

<br><br>

<button type="submit">

Save Settings

</button>

</form>

</body>

</html>
