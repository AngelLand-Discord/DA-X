<!DOCTYPE html>
<html>

<head>
    <title>Staff Access</title>
</head>

<body>

<h1>Manage Staff Access</h1>

<hr>

<form method="POST">

<input
type="text"
name="user_id"
placeholder="Discord User ID"
required>

<button type="submit">
Grant Staff Access
</button>

</form>

<hr>

<h2>Current Staff</h2>

{% for user in staff_users %}

<div>

User ID:
<b>{{ user.user_id }}</b>

Role:
<b>{{ user.role }}</b>

</div>

<br>

{% endfor %}

<hr>

<a href="/guild/{{ guild_id }}">
Back
</a>

</body>

</html>
