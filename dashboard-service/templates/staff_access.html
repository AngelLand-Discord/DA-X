<!DOCTYPE html>
<html>

<head>

    <title>

        Staff Access

    </title>

</head>

<body>

<h1>

Staff Access Management

</h1>

<a href="/guild/{{ guild_id }}">

Back

</a>

<hr>

<h2>

Add Staff Member

</h2>

<form method="POST">

<input
type="text"
name="user_id"
placeholder="Discord User ID"
required
>

<button type="submit">

Add Staff

</button>

</form>

<hr>

<h2>

Current Staff

</h2>

{% for user in staff_users %}

<div style="
border:1px solid gray;
padding:10px;
margin:10px;
">

User ID:

<b>

{{ user.user_id }}

</b>

<br>

Role:

<b>

{{ user.role }}

</b>

</div>

{% endfor %}

</body>

</html>
