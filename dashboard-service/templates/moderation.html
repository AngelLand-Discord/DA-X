<!DOCTYPE html>
<html>

<head>

    <title>

        Moderation

    </title>

</head>

<body>

<h1>

Moderation Panel

</h1>

<a href="/guild/{{ guild_id }}">

Back

</a>

<hr>

<form method="POST">

<h3>

Target User ID

</h3>

<input
type="text"
name="user_id"
required
>

<br><br>

<h3>

Action

</h3>

<select name="action">

<option value="warn">

Warn

</option>

<option value="kick">

Kick

</option>

<option value="ban">

Ban

</option>

<option value="timeout">

Timeout

</option>

</select>

<br><br>

<h3>

Reason

</h3>

<textarea
name="reason"
rows="5"
cols="60"
></textarea>

<br><br>

<button type="submit">

Execute

</button>

</form>

<hr>

<h2>

Recent Actions

</h2>

{% for log in logs %}

<div style="
border:1px solid gray;
padding:10px;
margin:10px;
">

<b>

{{ log.action }}

</b>

<br>

Target:

{{ log.target }}

<br>

Reason:

{{ log.reason }}

<br>

Timestamp:

{{ log.timestamp }}

</div>

{% endfor %}

</body>

</html>
