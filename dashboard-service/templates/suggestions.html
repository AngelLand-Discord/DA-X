<!DOCTYPE html>
<html>

<head>

    <title>Suggestions</title>

</head>

<body>

<h1>
Suggestions
</h1>

<a href="/guild/{{ guild_id }}">
Back
</a>

<hr>

<h2>
Submit Suggestion
</h2>

<form method="POST">

    <textarea
        name="suggestion"
        rows="10"
        cols="60"
        required
    ></textarea>

    <br><br>

    <button type="submit">

        Submit

    </button>

</form>

<hr>

<h2>
Existing Suggestions
</h2>

{% for suggestion in suggestions %}

<div
style="
border:1px solid gray;
padding:10px;
margin:10px;
"
>

<b>{{ suggestion.username }}</b>

<br><br>

{{ suggestion.suggestion }}

<br><br>

Status:
<b>{{ suggestion.status }}</b>

{% if level in ["OWNER", "STAFF"] %}
<br><br>
<a href="/suggestion/{{ suggestion.id }}/Approved">Approve</a>
|
<a href="/suggestion/{{ suggestion.id }}/Rejected">Reject</a>
|
<a href="/suggestion/{{ suggestion.id }}/Implemented">Implement</a>
|
<a href="/suggestion/{{ suggestion.id }}/Pending">Pending</a>
{% endif %}

</div>

{% endfor %}

</body>

</html>
